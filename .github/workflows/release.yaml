name: release
permissions: write-all
on:
  push:
    tags:
      - 'v*'  # 触发条件：推送到任意 v* 标签

jobs:
  # ==============================
  # Job 1: 交叉编译 Desktop 程序（Ubuntu）
  # ==============================
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Get current date for Wails cache
        id: date
        run: echo "date=$(Get-Date -Format 'yyyy-MM-dd')" >> $env:GITHUB_OUTPUT

      - name: Cache wails3 CLI
        id: cache-wails
        uses: actions/cache@v4
        with:
          path: ~\go\bin\wails3.exe
          key: ${{ runner.os }}-wails3-beta28-${{ steps.date.outputs.date }}

      - name: Install wails3
        if: steps.cache-wails.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.28

      - name: Add Go bin to PATH
        run: echo "$HOME\go\bin" >> $env:GITHUB_PATH

      - name: Build Desktop App
        shell: pwsh
        run: |
          wails3 task windows:build PRODUCTION=true

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: bin/dpanel-desktop.exe

      - name: Upload to donknap/dpanel Release
        env:
          GH_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} bin/dpanel-desktop.exe --repo donknap/dpanel --clobber

  # ==============================
  # Job 2: NSIS 安装包（Windows, ce/pe 并行）
  # ==============================
  package-installer:
    needs: build
    strategy:
      matrix:
        edition: ['ce', 'pe']
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Get current date for Wails cache
        id: date
        run: echo "date=$(Get-Date -Format 'yyyy-MM-dd')" >> $env:GITHUB_OUTPUT

      - name: Cache wails3 CLI
        id: cache-wails
        uses: actions/cache@v4
        with:
          path: ~\go\bin\wails3.exe
          key: ${{ runner.os }}-wails3-beta28-${{ steps.date.outputs.date }}

      - name: Install wails3
        if: steps.cache-wails.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.28

      - name: Add Go bin to PATH
        run: echo "$HOME\go\bin" >> $env:GITHUB_PATH

      - name: Cache NSIS
        id: cache-nsis
        uses: actions/cache@v4
        with:
          path: 'C:\Program Files (x86)\NSIS'
          key: ${{ runner.os }}-nsis-v1

      - name: Install NSIS
        if: steps.cache-nsis.outputs.cache-hit != 'true'
        run: winget install NSIS.NSIS --source winget --silent --accept-package-agreements --accept-source-agreements

      - name: Set NSIS PATH
        run: |
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Download Desktop Binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path "bin" -Force
          gh release download ${{ github.ref_name }} --pattern "dpanel-desktop.exe" -D bin --repo ${{ github.repository }}

      - name: Download Resources
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $headers = @{}
          $files = @(
            @{ url = "https://github.com/DPanel-dev/actions/releases/download/build-toolchain/amd64-windows-docker.exe"; out = "build\windows\resource\docker.exe" },
            @{ url = "https://github.com/DPanel-dev/actions/releases/download/build-toolchain/amd64-windows-docker-compose.exe"; out = "build\windows\resource\docker-compose.exe" },
            @{ url = "https://github.com/donknap/dpanel/releases/download/${env:GITHUB_REF_NAME}/dpanel-${{ matrix.edition }}-windows-amd64.exe"; out = "build\windows\resource\dpanel.exe" }
          )

          New-Item -ItemType Directory -Path "build\windows\resource" -Force

          foreach ($file in $files) {
            Write-Host "Downloading $($file.url)"
            try {
              Invoke-WebRequest -Uri $file.url -Headers $headers -OutFile $file.out -ErrorAction Stop
              if (Test-Path $file.out) {
                Write-Host "✅ Downloaded: $($file.out)"
              } else {
                throw "❌ Failed to download: $($file.url)"
              }
            } catch {
              Write-Host "❌ Error: $($_.Exception.Message)"
              exit 1
            }
          }

      - name: Build Installer
        shell: pwsh
        run: |
          wails3 task windows:create:nsis:installer

      - name: Rename Installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "bin\*installer.exe" | Select-Object -First 1
          if ($installer) {
            Rename-Item $installer.FullName "dpanel-desktop-${{ matrix.edition }}-amd64-installer.exe"
          }

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: bin/dpanel-desktop-${{ matrix.edition }}-amd64-installer.exe

      - name: Upload to donknap/dpanel Release
        env:
          GH_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} "bin\dpanel-desktop-${{ matrix.edition }}-amd64-installer.exe" --repo donknap/dpanel --clobber

  # ==============================
  # Job 3: 便携包（Ubuntu, ce/pe 并行）
  # ==============================
  package-portable:
    needs: build
    strategy:
      matrix:
        edition: ['ce', 'pe']
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Desktop Binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p bin
          gh release download ${{ github.ref_name }} --pattern "dpanel-desktop.exe" -D bin --repo ${{ github.repository }}

      - name: Download Resources
        run: |
          mkdir -p build/windows/resource
          curl -sL -o build/windows/resource/docker.exe "https://github.com/DPanel-dev/actions/releases/download/build-toolchain/amd64-windows-docker.exe"
          curl -sL -o build/windows/resource/docker-compose.exe "https://github.com/DPanel-dev/actions/releases/download/build-toolchain/amd64-windows-docker-compose.exe"
          curl -sL -o build/windows/resource/dpanel.exe "https://github.com/donknap/dpanel/releases/download/${{ github.ref_name }}/dpanel-${{ matrix.edition }}-windows-amd64.exe"

      - name: Build Portable
        run: |
          mkdir -p dpanel-desktop/apps/dpanel

          cp bin/dpanel-desktop.exe dpanel-desktop/
          cp build/windows/resource/setting.default.json dpanel-desktop/setting.json

          cp build/windows/resource/dpanel.exe dpanel-desktop/apps/dpanel/
          cp build/windows/resource/docker.exe dpanel-desktop/apps/dpanel/
          cp build/windows/resource/docker-compose.exe dpanel-desktop/apps/dpanel/

          7z a bin/dpanel-desktop-${{ matrix.edition }}-amd64-portable.zip dpanel-desktop

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: bin/dpanel-desktop-${{ matrix.edition }}-amd64-portable.zip

      - name: Upload to donknap/dpanel Release
        env:
          GH_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} bin/dpanel-desktop-${{ matrix.edition }}-amd64-portable.zip --repo donknap/dpanel --clobber

  # ==============================
  # Job 4: macOS CE/PE bundles
  # ==============================
  package-macos:
    strategy:
      fail-fast: false
      matrix:
        edition: [ce, pe]
        arch: [amd64, arm64]
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.28
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Download DPanel binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p bin
          for attempt in {1..12}; do
            if gh release download "${{ github.ref_name }}" \
              --repo donknap/dpanel \
              --pattern "dpanel-${{ matrix.edition }}-darwin-${{ matrix.arch }}" \
              --dir bin; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "DPanel macOS release binary is unavailable" >&2
              exit 1
            fi
            sleep 30
          done
          test -s "bin/dpanel-${{ matrix.edition }}-darwin-${{ matrix.arch }}"
          expected_arch="${{ matrix.arch }}"
          if [ "$expected_arch" = amd64 ]; then expected_arch=x86_64; fi
          test "$(lipo -archs "bin/dpanel-${{ matrix.edition }}-darwin-${{ matrix.arch }}")" = "$expected_arch"

      - name: Build macOS app
        run: |
          wails3 task darwin:package ARCH=${{ matrix.arch }} \
            DPANEL_BINARY="bin/dpanel-${{ matrix.edition }}-darwin-${{ matrix.arch }}"
          codesign --verify --deep --strict "bin/dpanel-desktop.app"
          ditto -c -k --sequesterRsrc --keepParent "bin/dpanel-desktop.app" \
            "bin/dpanel-desktop-${{ matrix.edition }}-darwin-${{ matrix.arch }}.app.zip"

      - name: Upload macOS package
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: bin/dpanel-desktop-${{ matrix.edition }}-darwin-${{ matrix.arch }}.app.zip

      - name: Upload to donknap/dpanel Release
        env:
          GH_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            "bin/dpanel-desktop-${{ matrix.edition }}-darwin-${{ matrix.arch }}.app.zip" \
            --repo donknap/dpanel --clobber

  # ==============================
  # Job 5: 上传全部产物到 COS（Ubuntu）
  # ==============================
  upload-cos:
    needs: [package-installer, package-portable, package-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download All Release Assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p bin
          gh release download ${{ github.ref_name }} -D bin --repo ${{ github.repository }}
          rm -f bin/dpanel-desktop.exe

      - name: Install coscli
        run: |
          wget -q https://cosbrowser.cloud.tencent.com/software/coscli/coscli-linux-amd64 -O coscli
          chmod +x coscli

      - name: Configure coscli
        env:
          COS_SECRET_ID: ${{ secrets.CDN_QCLOUD_COSV5_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.CDN_QCLOUD_COSV5_SECRET_KEY }}
        run: |
          cat > ~/.cos.yaml <<EOF
          cos:
            base:
              secretid: ${COS_SECRET_ID}
              secretkey: ${COS_SECRET_KEY}
          EOF

      - name: Upload to COS
        run: |
          ls -lh bin
          ./coscli cp -e cos.ap-shanghai.myqcloud.com bin/ cos://we7cloud-10016060/dpanel/release/ -r --part-size 10 --routines 20
          echo "All files uploaded to COS"

  update-homebrew-casks:
    needs: upload-cos
    runs-on: ubuntu-latest
    steps:
      - name: Check out DPanel Homebrew repository
        uses: actions/checkout@v4
        with:
          repository: DPanel-dev/homebrew
          token: ${{ secrets.MY_GITHUB_TOKEN }}

      - name: Update cask version and checksums
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          release="$(gh api "repos/donknap/dpanel/releases/tags/${RELEASE_TAG}")"
          if [[ "$(jq -r '.prerelease' <<< "$release")" != false ]]; then
            echo "Skipping prerelease $RELEASE_TAG"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version="${RELEASE_TAG#v}"
          for edition in ce pe; do
            cask=dpanel
            if [[ "$edition" == pe ]]; then cask=dpanel-pe; fi
            mapfile -t matches < <(find Casks -type f -name "${cask}.rb")
            if [[ "${#matches[@]}" -ne 1 ]]; then
              echo "Expected one ${cask}.rb in the Homebrew repository, found ${#matches[@]}" >&2
              exit 1
            fi
            cask_file="${matches[0]}"

            for arch in arm64 amd64; do
              asset="dpanel-desktop-${edition}-darwin-${arch}.app.zip"
              gh release download "$RELEASE_TAG" \
                --repo donknap/dpanel --pattern "$asset" --dir "$RUNNER_TEMP"
            done
            arm_sha="$(sha256sum "${RUNNER_TEMP}/dpanel-desktop-${edition}-darwin-arm64.app.zip" | cut -d ' ' -f 1)"
            intel_sha="$(sha256sum "${RUNNER_TEMP}/dpanel-desktop-${edition}-darwin-amd64.app.zip" | cut -d ' ' -f 1)"
            sed -i -E \
              -e "s/^  version \"[^\"]+\"$/  version \"$version\"/" \
              -e "s/^  sha256 arm:   \"[0-9a-f]{64}\",$/  sha256 arm:   \"$arm_sha\",/" \
              -e "s/^         intel: \"[0-9a-f]{64}\"$/         intel: \"$intel_sha\"/" \
              "$cask_file"
            grep -Fqx "  version \"$version\"" "$cask_file"
            grep -Fqx "  sha256 arm:   \"$arm_sha\"," "$cask_file"
            grep -Fqx "         intel: \"$intel_sha\"" "$cask_file"
          done

          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- Casks; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push Homebrew cask updates
        if: steps.update.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.update.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "DPanel-Dev"
          git config user.email "donknap@gmail.com"
          git add -- Casks
          git commit -m "Update DPanel casks to ${VERSION}"
          git push origin "HEAD:refs/heads/$(git branch --show-current)"
