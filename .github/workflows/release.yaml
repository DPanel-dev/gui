name: release
permissions: write-all
on:
  push:
    tags:
      - 'v*'  # 触发条件：推送到任意 v* 标签

jobs:
  windows-build-and-release:
    strategy:
      matrix:
        platform: ['windows-latest']
        go-version: ['1.22'] # wails3 推荐 1.21+
    runs-on: ${{ matrix.platform }}
    steps:
      # ==============================
      # 1. 环境准备与缓存
      # ==============================
      - name: Cache NSIS
        id: cache-nsis
        uses: actions/cache@v4
        with:
          path: 'C:\Program Files (x86)\NSIS'
          key: ${{ runner.os }}-nsis-v1

      - name: Install NSIS
        if: steps.cache-nsis.outputs.cache-hit != 'true'
        run: winget install NSIS.NSIS --source winget --silent --accept-package-agreements --accept-source-agreements

      - name: Set NSIS PATH
        run: |
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH
          makensis /VERSION

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true  # 修正了之前的缩进错误

      # ==============================
      # 2. 缓存并安装 Wails v3
      # ==============================
      - name: Get current date for Wails cache
        id: date
        run: echo "date=$(Get-Date -Format 'yyyy-MM-dd')" >> $env:GITHUB_OUTPUT

      - name: Cache wails3 CLI
        id: cache-wails
        uses: actions/cache@v4
        with:
          path: ~\go\bin\wails3.exe
          key: ${{ runner.os }}-wails3-${{ steps.date.outputs.date }}

      - name: Install wails3
        if: steps.cache-wails.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Add Go bin to PATH
        run: echo "$HOME\go\bin" >> $env:GITHUB_PATH

      # ==============================
      # 3. 下载外部资源
      # ==============================
      - name: Download Resource
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $headers = @{}
          $files = @(
            @{ url = "https://github.com/donknap/dpanel/releases/download/docker-cli-v1/docker-windows-x86_64.exe"; out = "build\windows\resource\docker.exe" },
            @{ url = "https://github.com/donknap/dpanel/releases/download/docker-cli-v1/docker-compose-windows-x86_64.exe"; out = "build\windows\resource\docker-compose.exe" },
            @{ url = "https://github.com/donknap/dpanel/releases/download/${env:GITHUB_REF_NAME}/dpanel.exe"; out = "build\windows\resource\dpanel.exe" }
          )

          New-Item -ItemType Directory -Path "build\windows\resource" -Force

          foreach ($file in $files) {
            Write-Host "Downloading $($file.url)"
            try {
              Invoke-WebRequest -Uri $file.url -Headers $headers -OutFile $file.out -ErrorAction Stop
              if (Test-Path $file.out) {
                Write-Host "✅ Downloaded: $($file.out)"
              } else {
                throw "❌ Failed to download: $($file.url)"
              }
            } catch {
              Write-Host "❌ Error: $($_.Exception.Message)"
              exit 1
            }
          }

      # ==============================
      # 4. 构建安装包
      # ==============================
      - name: Build Installer
        shell: pwsh
        run: |
          wails3 task windows:create:nsis:installer

      # ==============================
      # 5. 上传到当前仓库 Release
      # ==============================
      - name: Upload Release to Current Repo
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: bin/*
          prerelease: false

      # ==============================
      # 6. 直接上传到 donknap/dpanel Release (替代 Artifact)
      # ==============================
      - name: Upload to donknap/dpanel Release
        env:
          GH_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }} # 必须包含写权限的 PAT
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Write-Host "📤 Uploading files to https://github.com/donknap/dpanel/releases/tag/$tag"
          
          # 获取 bin 目录下的所有文件
          $files = Get-ChildItem -Path "bin" -File
          
          if ($files.Count -eq 0) {
            Write-Error "❌ No files found in 'bin' directory!"
            exit 1
          }

          # 遍历并使用 GitHub CLI 上传
          foreach ($file in $files) {
            Write-Host "⬆️ Uploading: $($file.Name)"
            gh release upload $tag $file.FullName --repo donknap/dpanel --clobber
          
            if ($LASTEXITCODE -ne 0) {
              Write-Error "❌ Failed to upload $($file.Name)"
              exit 1
            }
          }

          Write-Host "✅ All files uploaded successfully to donknap/dpanel@$tag"