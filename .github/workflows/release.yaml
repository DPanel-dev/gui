name: release
permissions: write-all
on:
  push:
    tags:
      - 'v*'  # 触发条件：推送到任意 v* 标签

jobs:
  windows-build:
    strategy:
      matrix:
        platform: ['windows-latest']
        go-version: ['1.25']
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Install NSIS
        run: winget install NSIS.NSIS --source winget --silent
      - name: Add NSIS to PATH
        run: echo "C:\Program Files (x86)\NSIS" >> $GITHUB_PATH
      - name: Test makensis
        run: |
          echo "PATH: %PATH%"
          makensis /VERSION
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Download Resource
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          $headers = @{}
          $files = @(
            @{ url = "https://github.com/donknap/dpanel/releases/download/docker-cli-v1/docker-windows-x86_64.exe"; out = "build\windows\resource\docker.exe" },
            @{ url = "https://github.com/donknap/dpanel/releases/download/docker-cli-v1/docker-compose-windows-x86_64.exe"; out = "build\windows\resource\docker-compose.exe" },
            @{ url = "https://github.com/donknap/dpanel/releases/download/${env:GITHUB_REF_NAME}/dpanel.exe"; out = "build\windows\resource\dpanel.exe" }
          )

          New-Item -ItemType Directory -Path "build\windows\resource" -Force

          foreach ($file in $files) {
            Write-Host "Downloading $($file.url)"
            try {
              Invoke-WebRequest -Uri $file.url -Headers $headers -OutFile $file.out -ErrorAction Stop
              if (Test-Path $file.out) {
                Write-Host "✅ Downloaded: $($file.out)"
              } else {
                throw "❌ Failed to download: $($file.url)"
              }
            } catch {
              Write-Host "❌ Error: $($_.Exception.Message)"
              exit 1
            }
          }
        shell: pwsh
      - name: Install wails3
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@latest
          echo "wails3 installed at $env:GOPATH\bin\wails3.exe"
          echo "$env:GOPATH\bin" >> $env:GITHUB_PATH
        env:
          GOPATH: ${{ runner.workspace }}/go
        shell: pwsh

      - name: Build Installer
        run: |
          wails3 task windows:create:nsis:installer
        shell: pwsh

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: bin/*
          prerelease: false
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name }}
          path: bin/**
          if-no-files-found: error
  # =============================
  # 第二个 Job：同步到 donknap/dpanel
  # =============================
  sync-to-dpanel-release:
    runs-on: ubuntu-latest
    needs: windows-build
    permissions:
      contents: write  # 允许操作 releases
    steps:
      - name: Setup Workspace
        run: |
          mkdir -p ./downloaded
          echo "📁 Created clean directory for artifact"
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.ref_name }}
          path: ./download
      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh
      - name: Upload to donknap/dpanel Release
        env:
          GH_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}  # 必须是 PAT，有 donknap/dpanel 写权限
        run: |
          ARTIFACT_DIR="download"
          
          if [ ! -d "$ARTIFACT_DIR" ]; then
            echo "❌ Directory '$ARTIFACT_DIR' not found!"
            exit 1
          fi

          if [ -z "$(ls -A $ARTIFACT_DIR)" ]; then
            echo "❌ No files found in '$ARTIFACT_DIR'!"
            exit 1
          fi

          TAG_NAME="${{ github.ref_name }}"

          echo "📤 Uploading files to https://github.com/donknap/dpanel/releases/tag/$TAG_NAME"

          for filepath in "$ARTIFACT_DIR"/*; do
            if [ -f "$filepath" ]; then
              filename=$(basename "$filepath")
              echo "⬆️ Uploading: $filename"
              gh release upload "$TAG_NAME" "$filepath" \
                --repo donknap/dpanel \
                --clobber \
                || (echo "❌ Failed to upload $filename" && exit 1)
            fi
          done

          echo "✅ All files uploaded successfully to donknap/dpanel@$TAG_NAME"
