name: release
permissions: write-all
on:
  push:
    tags:
      - 'v*'

jobs:
  download_resource:
    runs-on: ubuntu-latest
    steps:
      - name: Download Docker Cli
        continue-on-error: true
        run: |
          LATEST_ZIP=$(curl -s https://download.docker.com/win/static/stable/x86_64/ | grep -oE 'docker-[0-9.]+\.zip' | tail -n 1)
          wget https://download.docker.com/win/static/stable/x86_64/$LATEST_ZIP
          unzip $LATEST_ZIP
      - name: Download Docker Compose
        continue-on-error: true
        run: |
          URL=$(curl -s https://api.github.com/repos/docker/compose/releases/latest | jq -r '.assets[] | select(.name == "docker-compose-windows-x86_64.exe") | .browser_download_url')
          curl -L -o docker-compose.exe "$URL"
      - name: Download DPanel
        continue-on-error: true
        run: |
          URL=$(curl -s https://api.github.com/repos/donknap/dpanel/releases/latest | jq -r '.assets[] | select(.name == "dpanel.exe") | .browser_download_url')
          curl -L -o dpanel.exe "$URL"
      - name: Create Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: resource
          name: "Resource Collection"
          body: "Pre-built toolchains for ARM, ARM64, AMD64，MUSL and Synology platforms"
          files: |
            docker/docker.exe
            docker-compose.exe
            dpanel.exe
          draft: false
          prerelease: false
  windows-build:
    strategy:
      matrix:
        platform: [ 'windows-latest' ]
        go-version: [ '1.25' ]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Test Env
        run: |
          echo "Tag name from GITHUB_REF_NAME: $GITHUB_REF_NAME"
          echo "Tag name from github.ref_name: ${{ github.ref_name }}"
          echo "Tag name from github.ref: ${{ github.ref }}"
          echo "Runner OS: ${{ runner.os }}"

      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download Resource
        run: |
          $baseUrl = "https://github.com/donknap/dpanel-gui/releases/download/resource"
          New-Item -ItemType Directory -Path "build\windows\resource" -Force

          # GitHub Actions 会自动注入 GITHUB_TOKEN
          $token = $env:GITHUB_TOKEN
          $headers = @{ "Authorization" = "Bearer $token" }

          $files = @(
            @{ url = "$baseUrl/docker.exe";        out = "build\windows\resource\docker.exe" },
            @{ url = "$baseUrl/docker-compose.exe"; out = "build\windows\resource\docker-compose.exe" },
            @{ url = "$baseUrl/dpanel.exe";         out = "build\windows\resource\dpanel.exe" }
          )

          foreach ($file in $files) {
            Write-Host "Downloading $($file.url)..."
            try {
              Invoke-WebRequest -Uri $file.url -Headers $headers -OutFile $file.out -ErrorAction Stop
              if (Test-Path $file.out) {
                Write-Host "✅ Downloaded: $($file.out)"
              } else {
                throw "❌ Failed to download: $($file.url)"
              }
            } catch {
              Write-Host "❌ Error: $($_.Exception.Message)"
              exit 1
            }
          }
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install wails3
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@latest
          echo "wails3 installed at $env:GOPATH\bin\wails3.exe"
          echo "$env:GOPATH\bin" >> $env:GITHUB_PATH
        env:
          GOPATH: ${{ runner.workspace }}/go
        shell: pwsh

      - name: Build
        run: |
          wails3 task windows:create:nsis:installer
        shell: pwsh

      - name: Upload artifact
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: build/*
          prerelease: false